<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#201f1d" />
    <meta name="application-name" content="Get On A Pod" />
    <meta name="apple-mobile-web-app-title" content="Get On A Pod" />
    <meta name="msapplication-TileColor" content="#201f1d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Get booked on podcasts your customers listen to | Get On A Pod</title>
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Get On A Pod",
      "description": "Done-for-you podcast guesting for founders, executives, authors and coaches. You bring the story, we get you on the show.",
      "url": "https://getonapod.com",
      "logo": "https://getonapod.com/icon-512.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Sales",
        "availableLanguage": "English"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Done-for-you podcast guesting",
      "serviceType": "Podcast guest booking",
      "provider": {
        "@type": "Organization",
        "name": "Get On A Pod",
        "url": "https://getonapod.com"
      },
      "areaServed": "Worldwide",
      "description": "Get On A Pod pitches you to active shows in your niche, puts confirmed recordings on your calendar and sends a prep brief before each one. Then every episode comes back as 5 captioned vertical clips, ready to post on LinkedIn, Instagram, TikTok and YouTube Shorts. You approve every show, which takes about 15 minutes a week. Most clients have 2–4 bookings a month once outreach ramps up.",
      "offers": {
        "@type": "Offer",
        "price": "1000",
        "priceCurrency": "USD",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "1000",
          "priceCurrency": "USD",
          "billingDuration": "P1M"
        },
        "url": "https://getonapod.com/#pricing"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How many shows will I get booked on?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on your niche and how bookable your story is, but most clients see 2–4 confirmed bookings a month once outreach ramps up (usually by week three). We tell you the honest number for your niche on the first call — including if it's lower."
          }
        },
        {
          "@type": "Question",
          "name": "What kinds of podcasts do you pitch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vetted, active shows with real audiences in your space — not pay-to-play placements or dormant feeds. You see every show before we pitch it, and you approve every booking before we confirm."
          }
        },
        {
          "@type": "Question",
          "name": "When do I record my first episode?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pitches go out in week one. Most clients have their first recording on the calendar within 3–5 weeks, and episodes typically publish 2–8 weeks after recording, depending on the show."
          }
        },
        {
          "@type": "Question",
          "name": "Do I get clips from my episodes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, clipping is included. When an episode publishes, we get the full recording from the host and cut 5 vertical clips from its strongest moments, captioned so they work with the sound off and sized for LinkedIn, Instagram Reels, TikTok and YouTube Shorts. At 2–4 bookings a month, that is roughly 10–20 clips a month to post. The files are yours to keep and reuse."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a contract?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A 3-month minimum to start — that's how long it takes outreach to ramp and bookings to land. After that it's month to month, cancel anytime. If we're not putting you on shows worth your time, you shouldn't be paying us."
          }
        },
        {
          "@type": "Question",
          "name": "What do you need from me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "About an hour up front for the positioning interview, then roughly 15 minutes a week to approve shows. After that, just show up to the recordings — we handle everything else."
          }
        },
        {
          "@type": "Question",
          "name": "What if a host says no?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most do — that's the nature of outreach, and it's priced into the volume. Every pitch is personalized to the show, every follow-up is researched, and a no this quarter often becomes a yes next season when your proof gets stronger."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from a PR agency?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PR agencies charge $2,000–5,000 a month, spread across press, awards, and everything else. We do one thing — podcast guesting, from the first pitch to the clips you post afterwards — and we do it every week."
          }
        }
      ]
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
